[package]
name = "syncraft_server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
git2 = "0.21.0"
inquire = "0.9.4"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
owo-colors = "4.3.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.18.1", features = ["v4"] }
sys-locale = "0.3.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { version = "0.4.45", features = ["serde"] }
mc-skin = "0.1.0"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22.1"
console = "0.16.4"
libc = "0.2"
rsa = { version = "0.9.10", features = ["pem", "sha1"] }
sha1 = "0.10.0"
axum-extra = { version = "0.12.6", features = ["multipart", "typed-header"] }
blake3 = { version = "1.8.5", features = ["serde"] }

syncraft-protocol = { path = "../syncraft-protocol" }
futures = "0.3.32"
path-clean = "1.0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
